# ──────────────────────────────────────────
# kb-rag 配置文件参考模板
# 复制为 config.yaml 并按需修改
# config.yaml 本身已被 .gitignore 忽略，
# 各服务器可独立维护配置
# ──────────────────────────────────────────

# API 服务
api:
  host: "0.0.0.0"
  port: 8766

# 向量引擎
engine:
  # 嵌入模型，可选：
  #   BAAI/bge-small-zh-v1.5    (33MB, ⭐推荐，原生中文)
  #   BAAI/bge-m3               (更大，召回更好，需 reembed)
  #   intfloat/multilingual-e5-small  (118MB, 多语言)
  embed_model: "BAAI/bge-small-zh-v1.5"
  chroma_dir: ".chroma_db"
  collection_name: "knowledge_items"

# ═══════════════════════════════════════════
# 检索增强（v1.1.0）
# ═══════════════════════════════════════════
retrieval:
  # RRF 融合常数（越大越平滑，默认 60）
  rrf_k: 60
  # 向量 / BM25 各取候选数（RRF 前）
  vec_candidates: 30
  bm25_candidates: 50

  # 长文档分块（路径脑 brain_memory 自动跳过）
  chunking:
    enabled: true
    # 超过该字符数才切块
    min_chars: 1000
    chunk_size: 500
    overlap: 80

  # CrossEncoder 重排序（首次请求会下载模型）
  rerank:
    enabled: true
    model: "BAAI/bge-reranker-v2-m3"
    # 先 RRF 取 top_n，再 rerank 到最终 n_results
    top_n: 20

# ═══════════════════════════════════════════
# 脑记忆库（mb_* 工具专用）
# 与知识库(kb_*)分离存储，独立目录，互不影响
# ═══════════════════════════════════════════
memory:
  embed_model: "BAAI/bge-small-zh-v1.5"
  chroma_dir: ".chroma_db_memory"
  collection_name: "brain_memory"

# ═══════════════════════════════════════════
# LightRAG 知识图谱增强
# 不开启不影响基础搜索功能
# ═══════════════════════════════════════════
lightrag:
  enabled: false
  working_dir: ".lightrag_storage"

  llm:
    provider: deepseek
    api_key: "${DEEPSEEK_API_KEY}"
    model: deepseek-chat

  # ⚠️ 建议与 engine.embed_model 保持一致
  embed_model: "BAAI/bge-small-zh-v1.5"

  top_k: 10
  mode: mix
